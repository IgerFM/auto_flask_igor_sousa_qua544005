<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="Igor VRS">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto Flask</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <!-- Flavicon encontrado em (src="https://img.icons8.com/3d-stickle/100/cheap-2.png") | Ultimo acesso: 26/11/19 -->
    <link rel="shotcut icon" href="{{ url_for('static',filename='img/icoin.png') }}" type="image/png">
  </head>
  <body style="background-color: rgb(204, 226, 213);">
    <main class="container vh-100 d-flex align-items-center justify-content-center">
      <div class="row">
        <figure class="d-flex justify-content-center mb-5">
          <img src="{{ url_for('static',filename='img/icoin.png') }}" alt="Logo">
        </figure>
        <div class="d-flex justify-content-center mb-2">
          <h1>AUTO FLASK</h1>
        </div>
        <form action="" method="POST">
          <div class="col-12 mt-5">
            <label for="gasolina" class="form-label">Gasolina:</label>
            <input type="number" class="form-control" name="gasolina" placeholder="R$ 0,00" step="0.01" min="0" required>
          </div>
          <div class="col-12 mt-5">
            <label for="etanol" class="form-label">Etanol:</label>
            <input type="number" class="form-control" name="etanol" placeholder="R$ 0,00" step="0.01" min="0" required>
          </div>
          <div class="d-flex justify-content-center mt-5">
            <button type="submit" class="btn btn-primary">
              Verificar
            </button>
          </div>
        </form>
        <div class="d-flex justify-content-center mt-3 mb-5">
          <h2>{{ msg if msg else '' }}</h2>
        </div>
      </div>
    </main>
    <!-- Todo o codigo deve estar acima do Js do projeto -->
    <!-- js do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  </body>
</html>
